[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/postcode"
  to = "/.netlify/functions/postcode"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/count"
  to = "/.netlify/functions/count"
  status = 200

[[redirects]]
  from = "/api/admin-list"
  to = "/.netlify/functions/admin-list"
  status = 200

[[redirects]]
  from = "/api/admin-mark-paid"
  to = "/.netlify/functions/admin-mark-paid"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[redirects]]
  from = "/api/admin/seed-pots"
  to = "/.netlify/functions/admin-seed-pots"
  status = 200

[[redirects]]
  from = "/api/admin/list-pots"
  to = "/.netlify/functions/admin-list-pots"
  status = 200
[[redirects]]
  from = "/api/bezorger/orders"
  to = "/.netlify/functions/bezorger-orders"
  status = 200

[[redirects]]
  from = "/api/bezorger/deliver"
  to = "/.netlify/functions/bezorger-deliver"
  status = 200

[[redirects]]
  from = "/api/bezorger/undo"
  to = "/.netlify/functions/bezorger-undo"
  status = 200

[[redirects]]
  from = "/bezorger"
  to = "/bezorger.html"
  status = 200
[[redirects]]
  from = "/api/pot/*"
  to = "/.netlify/functions/pot-get"
  status = 200

[[redirects]]
  from = "/api/customer/request-pickup"
  to = "/.netlify/functions/customer-request-pickup"
  status = 200

[[redirects]]
  from = "/api/customer/reorder"
  to = "/.netlify/functions/customer-reorder"
  status = 200

[[redirects]]
  from = "/pot/*"
  to = "/pot.html"
  status = 200
[[redirects]]
  from = "/api/bezorger/set-status"
  to = "/.netlify/functions/bezorger-set-status"
  status = 200
[[redirects]]
  from = "/api/bezorger/pot-return"
  to = "/.netlify/functions/bezorger-pot-return"
  status = 200

[[redirects]]
  from = "/api/bezorger/extra-pot"
  to = "/.netlify/functions/bezorger-extra-pot"
  status = 200

[[redirects]]
  from = "/api/bezorger/customer-history"
  to = "/.netlify/functions/bezorger-customer-history"
  status = 200

[[redirects]]
  from = "/api/levering-info"
  to = "/.netlify/functions/levering-info"
  status = 200
