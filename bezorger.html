<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9301E">
<title>ELLEMELLE — bezorger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --red: #D9301E;
    --red-dark: #8B1A0E;
    --cream: #feece2;
    --cream-dark: #ECE3D2;
    --black: #1A1A1A;
    --white: #FFFFFF;
    --shadow-card: 0 2px 10px rgba(139,26,14,0.08);
    --shadow-cta: 0 6px 18px rgba(217,48,30,0.28);
    --radius-md: 14px;
  }
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--cream); color: var(--black);
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 16px; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
  #app { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; position: relative; }

  .step-question {
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--red); font-size: 28px; line-height: 1.15;
    margin-bottom: 14px; text-transform: none;
    letter-spacing: -0.2px; font-weight: 700;
  }

  /* Inputs */
  .field { margin-bottom: 10px; }
  input[type="text"], input[type="password"], select {
    width: 100%; min-height: 60px;
    padding: 16px 18px; font-size: 18px; font-family: inherit;
    background: var(--white); border: 2px solid transparent;
    border-radius: var(--radius-md); box-shadow: var(--shadow-card);
    color: var(--black);
    transition: border-color 140ms, box-shadow 140ms;
    appearance: none; -webkit-appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4' stroke='%238B1A0E' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 18px center;
    background-size: 16px 16px;
    padding-right: 48px;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(217,48,30,0.12), var(--shadow-card);
  }
  input::placeholder { color: rgba(0,0,0,0.32); }

  /* Buttons */
  .btn-primary {
    display: block; width: 100%; min-height: 60px;
    text-align: center; text-decoration: none; line-height: 60px;
    background: var(--red); color: var(--white); border: none;
    border-radius: var(--radius-md); font-family: inherit;
    font-size: 18px; font-weight: 700; letter-spacing: 0.2px;
    cursor: pointer; margin-top: 22px;
    box-shadow: var(--shadow-cta);
    transition: transform 90ms ease, opacity 140ms;
    appearance: none; -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary:disabled { background: #d4cfc4; color: rgba(0,0,0,0.4); cursor: not-allowed; box-shadow: none; }
  .btn-primary:not(:disabled):hover { transform: translateY(-1px); }
  .btn-primary:not(:disabled):active { transform: translateY(1px); }

  .btn-outline {
    display: block; width: 100%; min-height: 56px;
    background: transparent; color: var(--red);
    border: 2px solid var(--red); border-radius: var(--radius-md);
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.2px;
    cursor: pointer; margin-top: 10px;
    transition: background 140ms;
    text-align: center; text-decoration: none; line-height: 52px;
    appearance: none; -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: none;
  }
  .btn-outline:focus { outline: none; }
  .btn-outline:focus-visible { outline: 3px solid rgba(217,48,30,0.3); outline-offset: 2px; }
  .btn-outline:hover { background: rgba(217,48,30,0.06); }
  .btn-outline:active { background: rgba(217,48,30,0.12); }
  .btn-outline[hidden] { display: none; }

  /* Back link — plain black, no underline */
  .back-link {
    background: transparent; border: none; padding: 6px 0;
    color: var(--black); font-family: inherit; font-size: 15px;
    font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-block; margin-bottom: 4px;
  }
  .back-link:hover { color: var(--red-dark); }

  /* Order list cards */
  .order-card {
    background: var(--white); border: 1px solid rgba(0,0,0,0.08);
    border-radius: var(--radius-md); padding: 16px 18px;
    margin-bottom: 10px; line-height: 1.45;
  }
  .order-card .head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    margin-bottom: 6px;
  }
  .order-card .step-num {
    color: #666; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .order-card .name { font-weight: 700; font-size: 17px; color: var(--black); }
  .order-card .badge {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 700;
    letter-spacing: 0.3px; text-transform: uppercase; white-space: nowrap;
  }
  .order-card .badge.todo      { background: rgba(0,0,0,0.06); color: #555; }
  .order-card .badge.delivered { background: rgba(28,125,63,0.12); color: #1c7d3f; }
  .order-card .badge.neighbors { background: rgba(255,210,74,0.25); color: #b85c00; }
  .order-card .badge.retry     { background: rgba(139,26,14,0.08); color: var(--red-dark); }
  .order-card .addr { color: #666; font-size: 14px; margin-top: 4px; }
  .order-card .btn-outline { margin-top: 12px; }

  /* Info card (white box, no shadow) */
  .info-card {
    background: var(--white); border: 1px solid rgba(0,0,0,0.08);
    border-radius: var(--radius-md); padding: 16px 18px;
    margin: 14px 0; line-height: 1.45;
    box-shadow: none;
  }
  .info-card strong { display: block; color: var(--black); font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .info-card .sub { display: block; color: #666; font-size: 14px; }

  /* Detail rows */
  .detail-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--cream-dark); font-size: 14px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: #666; font-weight: 500; }
  .detail-row .v { color: var(--black); font-weight: 600; text-align: right; }
  .detail-row .v a { color: var(--red); text-decoration: none; }

  /* Stats */

  .stats { color: #666; font-size: 13px; text-align: left; margin: 0 0 14px; font-weight: 500; }
  .empty { color: #666; text-align: center; padding: 32px 0; font-size: 15px; }
  .error { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 18px; font-weight: 500; }

  /* Maps embed */
  .map-embed {
    width: 100%; height: 220px; border: 0;
    border-radius: var(--radius-md); margin-top: 4px;
    background: rgba(0,0,0,0.04);
  }

  /* Scanner */
  #scanner-wrap {
    position: relative; background: #000;
    border-radius: var(--radius-md); overflow: hidden;
    margin: 14px 0;
  }
  #scanner-video { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
  .scanner-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .scanner-overlay::after {
    content: ''; width: 60%; height: 60%;
    border: 3px solid rgba(255,255,255,0.6); border-radius: 14px;
  }
  .camera-hint {
    color: #666; font-size: 13px; margin-top: 8px;
    line-height: 1.4;
  }

  /* Actions group separator */
  .actions-divider {
    border: none; border-top: 1px dashed var(--cream-dark);
    margin: 28px 0 10px; height: 0;
  }
  .actions-label {
    color: #666; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 6px;
  }


  /* Standalone route CTA — primary style, lives above the order list */
  #route-btn {
    margin-top: 4px;
    margin-bottom: 14px;
    line-height: 60px;
  }
  #route-btn[hidden] { display: none; }
  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--black); color: white; padding: 12px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; z-index: 100;
    opacity: 0; transition: opacity 200ms;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    max-width: 90%; text-align: center; pointer-events: none;
  }
  .toast.success { background: #1c7d3f; }
  .toast.error { background: var(--red); }
  .toast.show { opacity: 1; }

  /* Hamburger menu (bottom drawer) */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .menu-btn {
    width: 44px; height: 44px; border: none; background: transparent;
    cursor: pointer; padding: 10px; color: var(--black);
    -webkit-tap-highlight-color: transparent;
  }
  .menu-btn svg { width: 24px; height: 24px; }
  .menu-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 200ms; z-index: 110;
  }
  .menu-backdrop.open { opacity: 1; pointer-events: auto; }
  .menu-panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--white); border-radius: 18px 18px 0 0;
    padding: 14px 20px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 240ms cubic-bezier(.2,.7,.2,1);
    z-index: 120; max-height: 86dvh; overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.2);
  }
  .menu-panel.open { transform: translateY(0); }
  .menu-panel .drawer-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(0,0,0,0.18); margin: 0 auto 18px;
  }
  .menu-panel a, .menu-panel > button:not(.btn-outline):not(.btn-primary) {
    display: block; width: 100%; padding: 14px 16px;
    background: transparent; border: none; cursor: pointer;
    text-align: left; font: 700 17px 'DM Sans', system-ui, sans-serif; color: var(--black);
    text-decoration: none; border-radius: var(--radius-md);
    -webkit-tap-highlight-color: transparent;
  }
  .menu-panel a:hover { background: rgba(217,48,30,0.06); }


  /* Admin login design */
  body.on-login { display: flex; flex-direction: column; align-items: center; }
  body.on-login #login-view { text-align: center; max-width: 380px; margin: 0 auto; }
  body.on-login #login-view h1 { margin-bottom: 32px; }
  body.on-login #login-view .field { margin-bottom: 4px; }
  body.on-login #login-view input { text-align: left; }
  body.on-login #login-view input::placeholder { text-align: left; }
  body.on-login #login-view .btn-primary { margin-top: 14px; }
  body.on-login .login-hero {
    width: 240px; max-width: 70vw; margin: 4px auto 18px; display: block;
    animation: wiggle 2.6s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 24%, 100% { transform: rotate(0deg); }
    6% { transform: rotate(-6deg); }
    12% { transform: rotate(6deg); }
    18% { transform: rotate(-3deg); }
  }

  .menu-panel .menu-logout-btn {
    margin-top: 14px;
    text-align: left;
    padding: 14px 16px;
    line-height: 1.2;
    min-height: 0;
  }
</style>
</head>
<body>

<!-- Hamburger bottom-drawer menu -->
<div class="menu-backdrop" id="menu-backdrop"></div>
<div class="menu-panel" id="menu-panel">
  <div class="drawer-handle"></div>
  <a href="/admin">Admin</a>
  <a href="/bezorger">Bezorgen</a>
  <a href="/bestellingen">Bestellingen</a>
  <a href="/voorraad">Voorraad</a>
  <a href="/koken">Koken</a>
  <button class="btn-outline menu-logout-btn" id="menu-logout" type="button">Uitloggen</button>
</div>

<main id="app">

  <!-- LOGIN -->
  <section id="login-view">
    <img class="login-hero" src="/Images/product.png" alt="ELLEMELLE pot" loading="eager">
    <h1 class="step-question" style="text-align: center;">Voer je wachtwoord in</h1>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord">
    </div>
    <div class="error" id="login-err"></div>
    <button class="btn-primary" id="login-btn">Start bezorging →</button>
  </section>

  <!-- LIST -->
  <section id="list-view" hidden>
    <div class="topbar">
      <h1 class="step-question" style="margin-bottom: 0;">Bezorgen</h1>
      <button class="menu-btn" id="menu-open" aria-label="Menu" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="field">
      <select id="week-select"></select>
    </div>
    <a id="route-btn" class="btn-primary" target="_blank" rel="noopener" hidden>Bekijk bezorgroute →</a>
    <div class="stats" id="stats"></div>
    <div id="orders-list"></div>
  </section>

  <!-- DETAIL -->
  <section id="detail-view" hidden>
    <button class="back-link" id="back-to-list">← Terug</button>
    <h1 class="step-question" id="detail-name"></h1>

    <!-- Primary actions: scan + buren + ophalen -->
    <div id="scan-view" hidden>
      <button class="btn-primary" id="start-scan-btn">Geef pot af →</button>
      <div id="scanner-wrap" hidden>
        <video id="scanner-video" playsinline muted></video>
        <div class="scanner-overlay"></div>
      </div>
      <div class="camera-hint" id="camera-hint" hidden>
        Geef toegang tot je camera om de pot te scannen.
      </div>
    </div>
    <div id="undo-view" hidden>
      <button class="btn-outline" id="undo-btn" type="button">Bezorging ongedaan maken</button>
    </div>
    <button class="btn-outline" id="left-with-neighbours-btn" type="button">Bezorgd bij buren</button>
    <button class="btn-outline" id="request-pickup-self-btn" type="button">Verzoek thuis ophalen</button>

    <!-- Map -->
    <hr class="actions-divider">
    <div class="actions-label" style="margin-bottom: 8px;">Route</div>
    <iframe class="map-embed" id="map-embed" referrerpolicy="no-referrer-when-downgrade" loading="lazy"></iframe>
    <a class="btn-outline" id="open-maps-btn" target="_blank" rel="noopener">Route</a>

    <!-- Contact info -->
    <div class="info-card" style="margin-top: 18px;">
      <div class="detail-row"><span class="k">Adres</span><span class="v" id="d-addr"></span></div>
      <div class="detail-row"><span class="k">Contact</span><span class="v" id="d-contact"></span></div>
    </div>

    <!-- Pot historie -->
    <hr class="actions-divider">
    <div class="actions-label">Statiegeld</div>
    <button class="btn-outline" id="return-pot-btn" type="button">Neem lege pot in</button>
    <div id="return-scan-view" hidden style="margin-top: 10px;">
      <div id="return-scanner-wrap" style="position: relative; background: #000; border-radius: var(--radius-md); overflow: hidden; margin: 0 0 8px;">
        <video id="return-scanner-video" playsinline muted style="width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover;"></video>
        <div class="scanner-overlay"></div>
      </div>
      <button class="btn-outline" id="return-scan-cancel-btn" type="button">Annuleer</button>
    </div>
    <div class="info-card" id="history-card" style="margin-top: 14px;">
      <div class="detail-row"><span class="k">Statiegeld</span><span class="v" id="d-credit">…</span></div>
      <div id="history-list" style="margin-top: 4px;"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import QrScanner from 'https://esm.sh/qr-scanner@1.4.2';

  const $  = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  const STORAGE_KEY = 'ellemelle_admin_session_v1';
  const SESSION_TTL = 90 * 24 * 60 * 60 * 1000; // 90 days

  // Base location for route optimisation (Busken Huëtstraat 11, 2032 VJ Haarlem)
  const BASE_LAT = 52.37901689;
  const BASE_LNG = 4.65146505;
  const BASE_LABEL = 'Busken Huëtstraat 11, Haarlem';

  const STATE = {
    password: null,
    weeks: [],
    currentWeek: null,
    currentOrder: null,
    qrScanner: null,
    returnScanner: null,
  };

  // --- Session helpers (90-day) ---
  function loadSession() {
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        // Backward-compat: migrate old key
        const oldRaw = localStorage.getItem('ellemelle_bezorger_session_v1');
        if (oldRaw) { localStorage.setItem(STORAGE_KEY, oldRaw); localStorage.removeItem('ellemelle_bezorger_session_v1'); raw = oldRaw; }
      }
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (!o || !o.savedAt || (Date.now() - o.savedAt) > SESSION_TTL) {
        localStorage.removeItem(STORAGE_KEY); return null;
      }
      return o.password || null;
    } catch { return null; }
  }
  function saveSession(pw) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ password: pw, savedAt: Date.now() })); } catch {}
  }
  function clearSession() {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  }

  function showToast(msg, type) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '') + ' show';
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function showView(id) {
    ['login-view','list-view','detail-view'].forEach(v => $('#' + v).hidden = (v !== id));
    document.body.classList.toggle('on-login', id === 'login-view');
  }

  // --- Distance + route optimisation (nearest-neighbour TSP) ---
  function hav(la1, ln1, la2, ln2) {
    const R = 6371;
    const dLat = (la2 - la1) * Math.PI / 180;
    const dLng = (ln2 - ln1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180) * Math.cos(la2*Math.PI/180) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function optimiseRoute(orders) {
    const known = orders.filter(o => o.lat && o.lng);
    const unknown = orders.filter(o => !o.lat || !o.lng);
    const out = [];
    let curLat = BASE_LAT, curLng = BASE_LNG;
    const remaining = [...known];
    while (remaining.length) {
      let best = 0, bestKm = Infinity;
      for (let i = 0; i < remaining.length; i++) {
        const km = hav(curLat, curLng, remaining[i].lat, remaining[i].lng);
        if (km < bestKm) { bestKm = km; best = i; }
      }
      const next = remaining.splice(best, 1)[0];
      out.push(next);
      curLat = next.lat; curLng = next.lng;
    }
    return out.concat(unknown);
  }

  function fmtWaLink(tel, text) {
    if (!tel) return '';
    const cleaned = tel.replace(/[^\d+]/g, '').replace(/^00/, '+').replace(/^0/, '+31');
    const url = 'https://wa.me/' + cleaned.replace('+','');
    return text ? url + '?text=' + encodeURIComponent(text) : url;
  }
  function fmtMailLink(email, subject, body) {
    if (!email) return '';
    let q = [];
    if (subject) q.push('subject=' + encodeURIComponent(subject));
    if (body) q.push('body=' + encodeURIComponent(body));
    return 'mailto:' + email + (q.length ? '?' + q.join('&') : '');
  }

  async function api(endpoint, payload) {
    const r = await fetch('/.netlify/functions/' + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ password: STATE.password }, payload || {})),
    });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, data: j };
  }

  async function loadOrders() {
    const res = await api('bezorger-orders');
    if (!res.ok) {
      showToast(res.data.error || 'Laden mislukt', 'error');
      return;
    }
    STATE.weeks = (res.data.weeks || []).map(w => Object.assign({}, w, { orders: optimiseRoute(w.orders) }));
    renderWeekSelect();
  }

  function renderWeekSelect() {
    const sel = $('#week-select');
    sel.innerHTML = '';
    if (STATE.weeks.length === 0) {
      sel.disabled = true;
      const opt = document.createElement('option');
      opt.textContent = 'Geen weken';
      sel.appendChild(opt);
      $('#orders-list').innerHTML = '<div class="empty">Nog geen bestellingen.</div>';
      $('#stats').textContent = '';
      return;
    }
    sel.disabled = false;
    STATE.weeks.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.iso;
      const weekNum = (w.iso.match(/W(\d+)/) || [,'?'])[1].replace(/^0+/, '') || '0';
      const stockTag = w.has_all_stock ? ' (op voorraad)' : ' (niet op voorraad)';
      const doneTag = w.all_done ? ' (klaar)' : '';
      const suffix = stockTag + doneTag;
      opt.textContent = 'Week ' + weekNum + suffix;
      sel.appendChild(opt);
    });
    sel.selectedIndex = STATE.weeks.length - 1;
    STATE.currentWeek = STATE.weeks[STATE.weeks.length - 1];
    renderOrders();
  }

  function googleMapsRouteUrl(orders) {
    // Loop route: origin = base, all stops as waypoints, destination = base.
    const origin = encodeURIComponent(BASE_LABEL);
    const addrs = orders.map(o => [o.straat, o.huisnummer, o.postcode, o.plaats].filter(Boolean).join(' '));
    if (addrs.length === 0) return null;
    const destination = origin; // come back home
    const waypoints = addrs.map(a => encodeURIComponent(a)).join('|');
    let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=walking`;
    if (waypoints) url += '&waypoints=' + waypoints;
    return url;
  }

  function renderOrders() {
    const wrap = $('#orders-list');
    wrap.innerHTML = '';
    if (!STATE.currentWeek || STATE.currentWeek.orders.length === 0) {
      wrap.innerHTML = '<div class="empty">Geen bestellingen voor deze week.</div>';
      $('#stats').textContent = '';
      return;
    }
    const w = STATE.currentWeek;
    $('#stats').textContent = `${w.delivered}/${w.total} bezorgd`;
    const routeUrl = googleMapsRouteUrl(w.orders);
    const routeBtn = document.getElementById('route-btn');
    if (routeBtn) {
      if (routeUrl && w.orders.length > 0) {
        routeBtn.href = routeUrl;
        routeBtn.hidden = false;
      } else {
        routeBtn.removeAttribute('href');
        routeBtn.hidden = true;
      }
    }

    w.orders.forEach((o, idx) => {
      const card = document.createElement('div');
      card.className = 'order-card';
      const status = o.order_status || 'todo';
      const STATUS_LABELS = { todo: 'Todo', delivered: 'Bezorgd', neighbors: 'Buren', retry: 'Nieuwe poging' };
      const badgeText = STATUS_LABELS[status] || 'Todo';
      const addr = [o.straat, [o.huisnummer, o.toevoeging].filter(Boolean).join('-')].filter(Boolean).join(' ');
      const stepHtml = `<span class="step-num">Stop ${idx + 1}</span>`;
      card.innerHTML = `
        <div class="head">
          ${stepHtml}
          <span class="badge ${status}">${badgeText}</span>
        </div>
        <div class="name">${o.voornaam || '(geen naam)'}</div>
        <div class="addr">${addr} — ${o.plaats || ''}</div>
        <button class="btn-outline open-detail" type="button">Route</button>
      `;
      // Whole-card click → open detail (default flow)
      card.addEventListener('click', (e) => {
        // The two buttons handle their own actions; ignore link clicks on the route button
        if (e.target.closest('a')) return;
        openDetail(o);
      });
      wrap.appendChild(card);
    });
  }

  function openDetail(order) {
    STATE.currentOrder = order;
    $('#detail-name').textContent = order.voornaam || '(geen naam)';
    const addrFull = `${order.straat} ${order.huisnummer}${order.toevoeging ? '-' + order.toevoeging : ''}`;
    const cityFull = `${order.postcode || ''} ${order.plaats || ''}`.trim();
    $('#d-addr').textContent = addrFull;
    const contactEl = $('#d-contact');
    if (order.kanaal === 'whatsapp' && order.telefoon) {
      contactEl.innerHTML = `<a href="${fmtWaLink(order.telefoon)}" target="_blank">${order.telefoon}</a>`;
    } else {
      contactEl.textContent = order.email || order.telefoon || '';
    }
    // Maps embed + open
    const fullAddress = [addrFull, cityFull].filter(Boolean).join(', ');
    const q = encodeURIComponent(fullAddress);
    $('#map-embed').src = `https://www.google.com/maps?q=${q}&output=embed`;
    $('#open-maps-btn').href = `https://www.google.com/maps?q=${q}`;

    if (order.delivered_pot) {
      $('#scan-view').hidden = true;
      $('#undo-view').hidden = false;
    } else {
      $('#scan-view').hidden = false;
      $('#undo-view').hidden = true;
    }
    // Hide return-scan-view in case it was open for previous order
    $('#return-scan-view').hidden = true;
    stopReturnScanner();
    // Load customer history (async, non-blocking)
    loadCustomerHistory(order.id);
    showView('detail-view');
  }

  // --- Customer history ---
  function fmtEuro(n) {
    return '€' + (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace('.', ',');
  }
  function fmtDate(iso) {
    try {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      return `${dd}-${mm}`;
    } catch { return ''; }
  }
  function historyLabel(entry) {
    switch (entry.action) {
      case 'pot-delivered':     return `Pot ${entry.pot_id || ''} bezorgd`;
      case 'pot-returned':      return `Pot ${entry.pot_id || ''} ingenomen (+€1,00)`;
      case 'extra-pot-ordered': return `Extra pot besteld${entry.credit_used ? ' (−' + fmtEuro(entry.credit_used) + ')' : ''}`;
      default: return entry.action || '-';
    }
  }
  async function loadCustomerHistory(orderId) {
    const creditEl = $('#d-credit');
    const listEl   = $('#history-list');
    creditEl.textContent = '…';
    listEl.innerHTML = '';
    const res = await api('bezorger-customer-history', { order_id: orderId });
    if (!res.ok) { creditEl.textContent = '–'; return; }
    const credit  = Number(res.data.statiegeld_credit || 0);
    const history = res.data.history || [];
    creditEl.textContent = credit > 0 ? fmtEuro(credit) + ' tegoed' : 'Geen tegoed';
    if (history.length === 0) {
      listEl.innerHTML = '<div class="sub" style="color:#666; font-size:13px; padding-top:6px;">Nog geen historie</div>';
      return;
    }
    // Newest first
    const sorted = [...history].sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
    sorted.slice(0, 8).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'detail-row';
      row.innerHTML = `<span class="k">${fmtDate(entry.ts)}</span><span class="v" style="font-weight:500;">${historyLabel(entry)}</span>`;
      listEl.appendChild(row);
    });
  }

  // --- Lege pot innemen (return) ---
  async function returnPot(potId) {
    if (!STATE.currentOrder) return;
    const res = await api('bezorger-pot-return', { order_id: STATE.currentOrder.id, pot_id: potId });
    if (res.ok) {
      showToast(`Pot ${res.data.pot_id} ingenomen — €1 tegoed`, 'success');
      stopReturnScanner();
      $('#return-scan-view').hidden = true;
      await loadCustomerHistory(STATE.currentOrder.id);
    } else {
      showToast(res.data.error || 'Innemen mislukt', 'error');
    }
  }
  async function startReturnScanner() {
    const video = $('#return-scanner-video');
    $('#return-scan-view').hidden = false;
    if (STATE.returnScanner) return;
    STATE.returnScanner = new QrScanner(video, async result => {
      const text = result.data || result;
      const m = /POT-\d{3}/i.exec(text);
      if (m) await returnPot(m[0].toUpperCase());
    }, { highlightScanRegion: true, returnDetailedScanResult: true });
    try { await STATE.returnScanner.start(); }
    catch (e) {
      stopReturnScanner();
      $('#return-scan-view').hidden = true;
      showToast('Camera niet beschikbaar', 'error');
    }
  }
  function stopReturnScanner() {
    if (STATE.returnScanner) { STATE.returnScanner.stop(); STATE.returnScanner.destroy(); STATE.returnScanner = null; }
  }

  // --- Extra pot toevoegen ---
  async function extraPot() {
    const o = STATE.currentOrder;
    if (!o) return;
    if (!confirm(`Extra pot voor ${o.voornaam}? We checken het tegoed en maken een nieuwe bestelling aan + sturen een Tikkie.`)) return;
    const res = await api('bezorger-extra-pot', { order_id: o.id });
    if (!res.ok) { showToast(res.data.error || 'Extra pot mislukt', 'error'); return; }
    const amount = Number(res.data.amount_due || 0);
    const credit = Number(res.data.credit_used || 0);
    const tikkie = res.data.tikkie_url || '';
    const creditLine = credit > 0 ? ` (${fmtEuro(credit)} verrekend met tegoed)` : '';
    const tekst = `Hi ${o.voornaam}, hierbij een extra pot Ellemelle voor je! Hij wordt zaterdag bezorgd. Bedrag: ${fmtEuro(amount)}${creditLine}.

${amount > 0 ? 'Tikkie: ' + tikkie : 'Niets te betalen — voor jou op de pof! ;)'}

Tot snel!
Ellis en Melle`;
    openContactWith(tekst);
    showToast('Extra pot aangemaakt', 'success');
    await loadCustomerHistory(o.id);
  }

  // --- Delivery / undo ---
  async function deliverPot(potId) {
    if (!STATE.currentOrder) return;
    const res = await api('bezorger-deliver', { order_id: STATE.currentOrder.id, pot_id: potId });
    if (res.ok) {
      showToast(`Pot ${res.data.pot_id} geregistreerd bij ${STATE.currentOrder.voornaam}`, 'success');
      stopScanner();
      await loadOrders();
      const updated = STATE.weeks.flatMap(w => w.orders).find(o => o.id === STATE.currentOrder.id);
      if (updated) openDetail(updated); else showView('list-view');
    } else {
      showToast(res.data.error || 'Registratie mislukt', 'error');
    }
  }

  async function startScanner() {
    const wrap = $('#scanner-wrap');
    const video = $('#scanner-video');
    $('#camera-hint').hidden = true;
    wrap.hidden = false;
    $('#start-scan-btn').textContent = 'Stop scanner';
    if (STATE.qrScanner) return;
    STATE.qrScanner = new QrScanner(video, async result => {
      const text = result.data || result;
      const m = /POT-\d{3}/i.exec(text);
      if (m) await deliverPot(m[0].toUpperCase());
    }, { highlightScanRegion: true, returnDetailedScanResult: true });
    try {
      await STATE.qrScanner.start();
    } catch (e) {
      stopScanner();
      $('#camera-hint').hidden = false;
      showToast('Camera niet beschikbaar', 'error');
    }
  }
  function stopScanner() {
    $('#scanner-wrap').hidden = true;
    $('#start-scan-btn').textContent = 'Geef pot af →';
    if (STATE.qrScanner) { STATE.qrScanner.stop(); STATE.qrScanner.destroy(); STATE.qrScanner = null; }
  }

  async function undoDelivery() {
    if (!STATE.currentOrder) return;
    if (!confirm(`Bezorging van ${STATE.currentOrder.voornaam} ongedaan maken? Pot ${STATE.currentOrder.delivered_pot} komt weer beschikbaar.`)) return;
    const res = await api('bezorger-undo', { order_id: STATE.currentOrder.id });
    if (res.ok) {
      showToast(`Bezorging ongedaan — ${res.data.undone_pot} weer beschikbaar`, 'success');
      await loadOrders();
      showView('list-view');
    } else {
      showToast(res.data.error || 'Undo mislukt', 'error');
    }
  }

  // --- Niet thuis flows ---
  async function leftWithNeighbours() {
    const o = STATE.currentOrder;
    if (!o) return;
    const huisnr = prompt('Welk huisnummer hebben we de pot afgegeven?');
    if (!huisnr) return;
    const tekst = `Hi ${o.voornaam}, je was helaas niet thuis vandaag! We hebben geprobeerd je pot Ellemelle langs te brengen. We hebben de pot chocopasta afgegeven bij je buren op nummer ${huisnr}.

Tot snel!
Ellis en Melle`;
    openContactWith(tekst);
    await api('bezorger-set-status', { order_id: o.id, status: 'neighbors' });
    await loadOrders();
  }
  async function requestPickupSelf() {
    const o = STATE.currentOrder;
    if (!o) return;
    const tekst = `Hi ${o.voornaam}, je was helaas niet thuis vandaag! We hebben geprobeerd je pot Ellemelle langs te brengen. We hebben je pot weer meegenomen en proberen het de komende dagen opnieuw. Wil je jouw pot sneller, dan kan ophalen op de Busken Huëtstraat 11 ook!

Tot snel!
Ellis en Melle`;
    openContactWith(tekst);
    await api('bezorger-set-status', { order_id: o.id, status: 'retry' });
    await loadOrders();
  }
  function openContactWith(tekst) {
    const o = STATE.currentOrder;
    if (o.kanaal === 'whatsapp' && o.telefoon) {
      window.open(fmtWaLink(o.telefoon, tekst), '_blank');
    } else if (o.email) {
      window.open(fmtMailLink(o.email, 'Je pot Ellemelle', tekst), '_blank');
    } else {
      showToast('Geen contactgegevens beschikbaar', 'error');
    }
  }

  // --- Bindings ---
  $('#login-btn').addEventListener('click', async () => {
    const pw = $('#pw').value.trim();
    if (!pw) return;
    STATE.password = pw;
    const res = await api('bezorger-orders');
    if (res.ok) {
      saveSession(pw);
      STATE.weeks = (res.data.weeks || []).map(w => Object.assign({}, w, { orders: optimiseRoute(w.orders) }));
      renderWeekSelect();
      showView('list-view');
    } else {
      $('#login-err').textContent = res.data.error === 'unauthorized' ? 'Verkeerd wachtwoord' : ('Fout: ' + (res.data.error || 'unknown'));
    }
  });
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-btn').click(); });

  $('#week-select').addEventListener('change', () => {
    const iso = $('#week-select').value;
    STATE.currentWeek = STATE.weeks.find(w => w.iso === iso) || null;
    renderOrders();
  });

  $('#back-to-list').addEventListener('click', () => { stopScanner(); stopReturnScanner(); $('#return-scan-view').hidden = true; showView('list-view'); });
  $('#start-scan-btn').addEventListener('click', () => { if (STATE.qrScanner) stopScanner(); else startScanner(); });
  $('#undo-btn').addEventListener('click', undoDelivery);
  $('#left-with-neighbours-btn').addEventListener('click', leftWithNeighbours);
  $('#request-pickup-self-btn').addEventListener('click', requestPickupSelf);
  $('#return-pot-btn').addEventListener('click', () => {
    if ($('#return-scan-view').hidden) startReturnScanner();
    else { stopReturnScanner(); $('#return-scan-view').hidden = true; }
  });
  $('#return-scan-cancel-btn').addEventListener('click', () => { stopReturnScanner(); $('#return-scan-view').hidden = true; });

  // Hamburger
  $('#menu-open')?.addEventListener('click', () => { $('#menu-backdrop').classList.add('open'); $('#menu-panel').classList.add('open'); });
  $('#menu-backdrop').addEventListener('click', () => { $('#menu-backdrop').classList.remove('open'); $('#menu-panel').classList.remove('open'); });
  $('#menu-logout')?.addEventListener('click', () => { clearSession(); location.reload(); });

  // Boot: auto-login if session valid
  STATE.password = loadSession();
  if (STATE.password) {
    api('bezorger-orders').then(res => {
      if (res.ok) {
        STATE.weeks = (res.data.weeks || []).map(w => Object.assign({}, w, { orders: optimiseRoute(w.orders) }));
        renderWeekSelect();
        showView('list-view');
      } else {
        clearSession();
        STATE.password = null;
        showView('login-view');
      }
    });
  } else {
    showView('login-view');
  }
</script>

</body>
</html>
