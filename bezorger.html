<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9301E">
<title>ELLEMELLE — bezorger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --red: #D9301E;
    --red-dark: #8B1A0E;
    --cream: #feece2;
    --cream-dark: #ECE3D2;
    --black: #1A1A1A;
    --white: #FFFFFF;
    --grey: #666;
    --radius-md: 14px;
    --shadow-card: 0 2px 10px rgba(139,26,14,0.08);
  }
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--cream);
    color: var(--black);
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 80px; }
  h1 {
    font-size: 22px; color: var(--red); font-weight: 700; margin-bottom: 4px;
  }
  .subtitle { color: var(--grey); font-size: 14px; margin-bottom: 22px; }
  .card {
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .order-card {
    cursor: pointer;
    transition: border-color 120ms, transform 90ms;
  }
  .order-card:hover { border-color: rgba(217,48,30,0.3); }
  .order-card .row1 { display: flex; justify-content: space-between; align-items: baseline; }
  .order-card .name { font-weight: 700; font-size: 17px; color: var(--black); }
  .order-card .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 700;
  }
  .order-card .badge.pending { background: #fff3e0; color: #b85c00; }
  .order-card .badge.delivered { background: #e0f5e6; color: #1c7d3f; }
  .order-card .addr { color: var(--grey); font-size: 14px; margin-top: 4px; }
  .order-card .contact { color: var(--grey); font-size: 13px; margin-top: 6px; }
  .order-card .contact a { color: var(--red); text-decoration: none; }

  .field { margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--grey); margin-bottom: 4px; font-weight: 500; }
  input[type="password"], select, input[type="text"] {
    width: 100%; padding: 14px 16px; font-size: 16px; font-family: inherit;
    background: var(--white); border: 1.5px solid rgba(0,0,0,0.1); border-radius: 12px;
    color: var(--black); outline: none;
  }
  input:focus, select:focus { border-color: var(--red); }

  .btn-primary {
    display: block; width: 100%; min-height: 56px; background: var(--red); color: var(--white);
    border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
  }
  .btn-primary:disabled { background: #d4cfc4; color: rgba(0,0,0,0.4); cursor: not-allowed; }
  .btn-secondary {
    display: block; width: 100%; min-height: 48px; background: transparent; color: var(--red);
    border: 2px solid var(--red); border-radius: var(--radius-md); font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 10px;
  }
  .btn-link {
    background: transparent; border: none; color: var(--red-dark); font: inherit;
    font-weight: 600; text-decoration: underline; cursor: pointer; padding: 6px 0;
  }
  .week-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .week-bar select { flex: 1; }
  .stats { color: var(--grey); font-size: 13px; text-align: right; margin-bottom: 10px; }
  .error { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .empty { color: var(--grey); text-align: center; padding: 32px 0; font-size: 15px; }

  /* Detail view */
  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--grey); font-weight: 500; }
  .detail-row .v { color: var(--black); font-weight: 600; text-align: right; }
  .detail-row .v a { color: var(--red); text-decoration: none; }

  /* Scanner */
  #scanner-wrap { position: relative; background: #000; border-radius: 16px; overflow: hidden; margin: 14px 0; }
  #scanner-video { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
  .scanner-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .scanner-overlay::after {
    content: ''; width: 60%; height: 60%; border: 3px solid rgba(255,255,255,0.6); border-radius: 14px;
  }
  .manual-pot {
    margin-top: 12px; padding: 14px; background: #fafafa; border-radius: 12px;
    font-size: 13px; color: var(--grey);
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--black); color: white; padding: 12px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; z-index: 100;
    opacity: 0; transition: opacity 200ms;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    max-width: 90%; text-align: center;
  }
  .toast.success { background: #1c7d3f; }
  .toast.error { background: var(--red); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<main class="wrap">
  <!-- LOGIN -->
  <section id="login-view">
    <h1>Bezorger</h1>
    <p class="subtitle">Log in om bestellingen te zien.</p>
    <div class="card">
      <div class="field">
        <label for="pw">Wachtwoord</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••">
      </div>
      <div class="error" id="login-err"></div>
      <button class="btn-primary" id="login-btn">Inloggen</button>
    </div>
  </section>

  <!-- LIST -->
  <section id="list-view" hidden>
    <h1>Bezorglijst</h1>
    <p class="subtitle" id="list-subtitle">Kies een week en tap een order om te bezorgen.</p>
    <div class="week-bar">
      <select id="week-select"></select>
      <button class="btn-link" id="logout-btn">Uitloggen</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="orders-list"></div>
  </section>

  <!-- DETAIL -->
  <section id="detail-view" hidden>
    <button class="btn-link" id="back-to-list">← Terug naar lijst</button>
    <h1 id="detail-name" style="margin-top: 8px;"></h1>
    <p class="subtitle" id="detail-status"></p>
    <div class="card">
      <div class="detail-row"><span class="k">Adres</span><span class="v" id="d-addr"></span></div>
      <div class="detail-row"><span class="k">Postcode</span><span class="v" id="d-pc"></span></div>
      <div class="detail-row"><span class="k">Kanaal</span><span class="v" id="d-kanaal"></span></div>
      <div class="detail-row"><span class="k">Contact</span><span class="v" id="d-contact"></span></div>
      <div class="detail-row" id="d-delivered-row" hidden><span class="k">Bezorgd</span><span class="v" id="d-delivered"></span></div>
    </div>

    <div id="scan-view" hidden>
      <button class="btn-primary" id="start-scan-btn">Scan pot QR-code</button>
      <div id="scanner-wrap" hidden>
        <video id="scanner-video" playsinline muted></video>
        <div class="scanner-overlay"></div>
      </div>
      <details class="manual-pot">
        <summary style="cursor:pointer;">Of vul pot-ID handmatig in</summary>
        <div class="field" style="margin-top: 10px;">
          <input id="manual-pot-input" type="text" placeholder="POT-007" autocapitalize="characters" maxlength="7">
        </div>
        <button class="btn-secondary" id="manual-deliver-btn">Bezorg met dit pot-ID</button>
      </details>
    </div>

    <div id="undo-view" hidden>
      <button class="btn-secondary" id="undo-btn">Bezorging ongedaan maken</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<!-- QR scanner library (vector-friendly, uses BarcodeDetector or wasm fallback) -->
<script type="module">
  // qr-scanner via esm.sh CDN
  import QrScanner from 'https://esm.sh/qr-scanner@1.4.2';

  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  const STATE = {
    password: localStorage.getItem('ellemelle_bezorger_pw') || '',
    weeks: [],
    currentWeek: null,
    currentOrder: null,
    qrScanner: null,
  };

  function showToast(msg, type) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '') + ' show';
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => { t.classList.remove('show'); }, 3000);
  }

  function showView(id) {
    ['login-view', 'list-view', 'detail-view'].forEach(v => $('#' + v).hidden = (v !== id));
  }

  async function api(endpoint, payload) {
    const r = await fetch('/.netlify/functions/' + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ password: STATE.password }, payload || {})),
    });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, data: j };
  }

  async function loadOrders() {
    const res = await api('bezorger-orders');
    if (!res.ok) {
      showToast(res.data.error || 'Laden mislukt', 'error');
      return;
    }
    STATE.weeks = res.data.weeks || [];
    renderWeekSelect();
  }

  function renderWeekSelect() {
    const sel = $('#week-select');
    sel.innerHTML = '';
    if (STATE.weeks.length === 0) {
      sel.disabled = true;
      $('#orders-list').innerHTML = '<div class="empty">Nog geen bestellingen.</div>';
      return;
    }
    sel.disabled = false;
    // Default to most recent week
    const todayISO = new Date().toISOString().slice(0,4) + '-W' +
      String(Math.ceil((((new Date() - new Date(new Date().getFullYear(), 0, 1)) / 86400000) + 1) / 7)).padStart(2,'0');
    let defaultIdx = STATE.weeks.findIndex(w => w.iso === todayISO);
    if (defaultIdx < 0) defaultIdx = STATE.weeks.length - 1;
    STATE.weeks.forEach((w, i) => {
      const opt = document.createElement('option');
      opt.value = w.iso;
      opt.textContent = `${w.label} (${w.total})`;
      sel.appendChild(opt);
    });
    sel.selectedIndex = defaultIdx;
    STATE.currentWeek = STATE.weeks[defaultIdx];
    renderOrders();
  }

  function renderOrders() {
    const wrap = $('#orders-list');
    wrap.innerHTML = '';
    if (!STATE.currentWeek || STATE.currentWeek.orders.length === 0) {
      wrap.innerHTML = '<div class="empty">Geen bestellingen voor deze week.</div>';
      $('#stats').textContent = '';
      return;
    }
    const w = STATE.currentWeek;
    $('#stats').textContent = `${w.delivered}/${w.total} bezorgd`;
    for (const o of w.orders) {
      const card = document.createElement('div');
      card.className = 'card order-card';
      const delivered = !!o.delivered_pot;
      const fullName = (o.voornaam || '(geen naam)');
      const addr = [o.straat, [o.huisnummer, o.toevoeging].filter(Boolean).join('-')].filter(Boolean).join(' ');
      const contact = o.kanaal === 'whatsapp'
        ? (o.telefoon ? `<a href="https://wa.me/${o.telefoon.replace(/[^\d+]/g,'').replace(/^00/,'+').replace(/^0/, '+31')}" target="_blank">WhatsApp ${o.telefoon}</a>` : '')
        : (o.email ? `<a href="mailto:${o.email}">${o.email}</a>` : '');
      card.innerHTML = `
        <div class="row1">
          <span class="name">${fullName}</span>
          <span class="badge ${delivered ? 'delivered' : 'pending'}">${delivered ? '✓ ' + o.delivered_pot : 'Open'}</span>
        </div>
        <div class="addr">${addr} — ${o.postcode || ''} ${o.plaats || ''}</div>
        <div class="contact">${contact}</div>
      `;
      card.addEventListener('click', () => openDetail(o));
      wrap.appendChild(card);
    }
  }

  function openDetail(order) {
    STATE.currentOrder = order;
    $('#detail-name').textContent = order.voornaam || '(geen naam)';
    $('#detail-status').textContent = order.delivered_pot
      ? `Bezorgd met ${order.delivered_pot} op ${new Date(order.delivered_at).toLocaleString('nl-NL')}`
      : 'Nog te bezorgen';
    $('#d-addr').textContent = `${order.straat} ${order.huisnummer}${order.toevoeging ? '-' + order.toevoeging : ''}`;
    $('#d-pc').textContent = `${order.postcode || ''} ${order.plaats || ''}`;
    $('#d-kanaal').textContent = order.kanaal === 'whatsapp' ? 'WhatsApp' : 'E-mail';
    const contactEl = $('#d-contact');
    if (order.kanaal === 'whatsapp' && order.telefoon) {
      const tel = order.telefoon.replace(/[^\d+]/g,'').replace(/^00/,'+').replace(/^0/, '+31');
      contactEl.innerHTML = `<a href="https://wa.me/${tel}" target="_blank">${order.telefoon}</a>`;
    } else {
      contactEl.textContent = order.email || order.telefoon || '';
    }
    if (order.delivered_pot) {
      $('#d-delivered-row').hidden = false;
      $('#d-delivered').textContent = order.delivered_pot;
      $('#scan-view').hidden = true;
      $('#undo-view').hidden = false;
    } else {
      $('#d-delivered-row').hidden = true;
      $('#scan-view').hidden = false;
      $('#undo-view').hidden = true;
    }
    showView('detail-view');
  }

  async function deliverPot(potId) {
    if (!STATE.currentOrder) return;
    const res = await api('bezorger-deliver', {
      order_id: STATE.currentOrder.id,
      pot_id: potId,
    });
    if (res.ok) {
      showToast(`Pot ${res.data.pot_id} bezorgd bij ${STATE.currentOrder.voornaam}!`, 'success');
      stopScanner();
      await loadOrders();
      // Refresh detail view with updated order
      const updated = STATE.weeks.flatMap(w => w.orders).find(o => o.id === STATE.currentOrder.id);
      if (updated) openDetail(updated);
      else showView('list-view');
    } else {
      showToast(res.data.error || 'Bezorging mislukt', 'error');
    }
  }

  async function startScanner() {
    const wrap = $('#scanner-wrap');
    const video = $('#scanner-video');
    wrap.hidden = false;
    $('#start-scan-btn').textContent = 'Stop scanner';
    if (STATE.qrScanner) return;
    STATE.qrScanner = new QrScanner(video, async result => {
      const text = result.data || result;
      const m = /POT-\d{3}/i.exec(text);
      if (m) {
        const potId = m[0].toUpperCase();
        await deliverPot(potId);
      }
    }, { highlightScanRegion: true, returnDetailedScanResult: true });
    try {
      await STATE.qrScanner.start();
    } catch (e) {
      showToast('Camera niet beschikbaar — gebruik handmatige invoer', 'error');
      stopScanner();
    }
  }

  function stopScanner() {
    $('#scanner-wrap').hidden = true;
    $('#start-scan-btn').textContent = 'Scan pot QR-code';
    if (STATE.qrScanner) {
      STATE.qrScanner.stop();
      STATE.qrScanner.destroy();
      STATE.qrScanner = null;
    }
  }

  async function undoDelivery() {
    if (!STATE.currentOrder) return;
    if (!confirm(`Bezorging van ${STATE.currentOrder.voornaam} ongedaan maken? Pot ${STATE.currentOrder.delivered_pot} komt weer beschikbaar.`)) return;
    const res = await api('bezorger-undo', { order_id: STATE.currentOrder.id });
    if (res.ok) {
      showToast(`Bezorging ongedaan — ${res.data.undone_pot} weer beschikbaar`, 'success');
      await loadOrders();
      showView('list-view');
    } else {
      showToast(res.data.error || 'Undo mislukt', 'error');
    }
  }

  // Event bindings
  $('#login-btn').addEventListener('click', async () => {
    const pw = $('#pw').value;
    if (!pw) return;
    STATE.password = pw;
    const res = await api('bezorger-orders');
    if (res.ok) {
      localStorage.setItem('ellemelle_bezorger_pw', pw);
      STATE.weeks = res.data.weeks || [];
      renderWeekSelect();
      showView('list-view');
    } else {
      $('#login-err').textContent = res.data.error === 'unauthorized' ? 'Verkeerd wachtwoord' : ('Fout: ' + (res.data.error || 'unknown'));
    }
  });
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-btn').click(); });

  $('#logout-btn').addEventListener('click', () => {
    localStorage.removeItem('ellemelle_bezorger_pw');
    STATE.password = '';
    $('#pw').value = '';
    showView('login-view');
  });

  $('#week-select').addEventListener('change', () => {
    const iso = $('#week-select').value;
    STATE.currentWeek = STATE.weeks.find(w => w.iso === iso) || null;
    renderOrders();
  });

  $('#back-to-list').addEventListener('click', () => {
    stopScanner();
    showView('list-view');
  });

  $('#start-scan-btn').addEventListener('click', () => {
    if (STATE.qrScanner) stopScanner();
    else startScanner();
  });

  $('#manual-deliver-btn').addEventListener('click', () => {
    const v = $('#manual-pot-input').value.trim().toUpperCase();
    if (/^POT-\d{3}$/.test(v)) deliverPot(v);
    else showToast('Ongeldig pot-ID. Voorbeeld: POT-007', 'error');
  });

  $('#undo-btn').addEventListener('click', undoDelivery);

  // Auto-login if password is in localStorage
  if (STATE.password) {
    api('bezorger-orders').then(res => {
      if (res.ok) {
        STATE.weeks = res.data.weeks || [];
        renderWeekSelect();
        showView('list-view');
      } else {
        localStorage.removeItem('ellemelle_bezorger_pw');
        STATE.password = '';
        showView('login-view');
      }
    });
  } else {
    showView('login-view');
  }
</script>

</body>
</html>
