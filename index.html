<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D9301E">
<meta name="description" content="ELLEMELLE — ambachtelijke chocopasta met 3× minder suiker. Door Ellis & Melle uit Haarlem.">
<meta property="og:title" content="ELLEMELLE — Chocopasta door Ellis & Melle">
<meta property="og:description" content="Ambachtelijke chocopasta. 3× minder suiker. Door Ellis & Melle uit Haarlem.">
<meta property="og:image" content="/Images/product.png">
<title>ELLEMELLE — Chocopasta door Ellis & Melle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D9301E;
    --red-dark: #8B1A0E;
    --cream: #fdf4ea;
    --cream-dark: #ECE3D2;
    --black: #1A1A1A;
    --white: #FFFFFF;
    --gold: #FFD24A;
    --shadow-card: 0 2px 10px rgba(139,26,14,0.08);
    --shadow-cta: 0 6px 18px rgba(217,48,30,0.28);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--cream);
    color: var(--black);
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }

  .display, .wordmark, h2 {
    font-family: 'Bagel Fat One', 'Bowlby One', Impact, system-ui, sans-serif;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 20px 28px;
    position: relative;
  }

  /* Counter — full-width top banner */
  .top-banner {
    width: 100%;
    background: #f1e7d4;
    color: var(--red-dark);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    text-align: center;
    padding: 11px 16px;
    line-height: 1.2;
    border-bottom: 1px solid rgba(139,26,14,0.07);
  }
  .top-banner.full { background: var(--red); color: var(--white); }

  /* Topbar */
  .topbar {
    display: block;
    margin-bottom: 16px;
  }
  .back-btn {
    width: 40px; height: 40px;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--red-dark);
    font-size: 22px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms;
  }
  .back-btn:hover, .back-btn:focus-visible { background: rgba(217,48,30,0.10); outline: none; }
  .back-btn[hidden] { visibility: hidden; display: flex; }
  /* Brand wordmark/logo (legacy; not rendered) */
  .brand-wrap, .brand-logo, .wordmark { display: none; }
  .progress-text {
    color: var(--red-dark);
    font-size: 13px;
    font-weight: 700;
    text-align: left;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    opacity: 0.55;
  }

  /* Steps */
  .steps { position: relative; }
  .step { display: none; animation: slideIn 260ms cubic-bezier(.2,.7,.2,1); }
  .step.active { display: block; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .step-eyebrow {
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    margin-bottom: 12px;
  }
  .step-question {
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--red);
    font-size: 28px;
    line-height: 1.15;
    margin-bottom: 14px;
    text-transform: none;
    letter-spacing: -0.2px;
    font-weight: 700;
  }
  .step-subtitle {
    color: var(--black);
    opacity: 0.65;
    font-size: 15px;
    line-height: 1.45;
    margin-bottom: 22px;
  }

  /* Inputs */
  .field { margin-bottom: 10px; }
  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%;
    min-height: 60px;
    padding: 16px 18px;
    font-size: 18px;
    font-family: inherit;
    background: var(--white);
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    color: var(--black);
    transition: border-color 140ms, box-shadow 140ms;
  }
  input:focus {
    outline: none;
    border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(217,48,30,0.12), var(--shadow-card);
  }
  input::placeholder { color: rgba(0,0,0,0.32); }

  .row-2 { display: grid; grid-template-columns: 1fr 100px; gap: 10px; }

  .address-confirm {
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-size: 15px;
    color: var(--red-dark);
    margin: 14px 0;
    line-height: 1.4;
  }
  .address-confirm.loading { color: rgba(0,0,0,0.55); font-style: italic; }
  .address-confirm.notfound { color: var(--red-dark); }
  .address-confirm strong { display: block; font-size: 16px; margin-bottom: 2px; color: var(--black); }
  .address-confirm small { color: rgba(0,0,0,0.55); }

  .error {
    color: var(--red);
    font-size: 13px;
    font-weight: 500;
    margin-top: 10px;
    display: none;
    line-height: 1.35;
  }
  .error.visible { display: block; }

  /* CTAs */
  .btn-primary {
    display: block;
    width: 100%;
    min-height: 60px;
    text-align: center;
    text-decoration: none;
    line-height: 60px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    margin-top: 22px;
    box-shadow: var(--shadow-cta);
    transition: transform 90ms ease, opacity 140ms;
  }
  .btn-primary:disabled {
    background: #d4cfc4;
    color: rgba(0,0,0,0.4);
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-primary:not(:disabled):hover { transform: translateY(-1px); }
  .btn-primary:not(:disabled):active { transform: translateY(1px); }

  .btn-outline {
    display: block;
    width: 100%;
    min-height: 60px;
    background: transparent;
    color: var(--red);
    border: 2px solid var(--red);
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    margin-top: 12px;
    transition: background 140ms, color 140ms;
  }
  .btn-outline:hover { background: rgba(217,48,30,0.06); }
  .btn-outline:active { background: rgba(217,48,30,0.12); }
  .btn-outline[hidden] { display: none; }

  .btn-link {
    background: transparent;
    border: none;
    color: var(--red-dark);
    font: inherit;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }

  /* Kanaal cards */
  .kanaal-options { display: grid; gap: 12px; }
  .kanaal-card {
    display: flex; align-items: center; gap: 16px;
    min-height: 88px;
    padding: 18px 20px;
    background: var(--white);
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    color: var(--red-dark);
    font-family: inherit;
    text-align: left;
    box-shadow: var(--shadow-card);
    transition: border-color 120ms, transform 90ms;
    width: 100%;
  }
  .kanaal-card:hover { border-color: var(--red); transform: translateY(-1px); }
  .kanaal-card .ic { font-size: 30px; line-height: 1; }
  .kanaal-card .label { font-size: 18px; }
  .kanaal-card .sub { font-size: 12px; opacity: 0.6; font-weight: 500; margin-top: 2px; display: block; }

  /* Order summary */
  .order-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 18px 18px;
    box-shadow: var(--shadow-card);
    margin-bottom: 14px;
  }
  .order-line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 15px; }
  .order-line.total {
    border-top: 2px dashed var(--cream-dark);
    padding-top: 12px; margin-top: 8px;
    font-weight: 700; font-size: 19px; color: var(--red-dark);
  }
  .order-meta {
    font-size: 13.5px;
    line-height: 1.55;
    color: rgba(0,0,0,0.72);
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--cream-dark);
  }
  .order-meta strong { color: var(--red-dark); }

  .check-row {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 12px 0;
    padding: 12px 14px;
    background: rgba(255,255,255,0.6);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    font-size: 15px;
    line-height: 1.4;
  }
  .check-row input {
    width: 22px; height: 22px; flex-shrink: 0;
    accent-color: var(--red);
    cursor: pointer;
    margin-top: 1px;
  }

  /* Success */
  .step.success { text-align: center; }
  .success .step-question { font-size: 30px; }
  .success-emoji { font-size: 56px; margin-bottom: 6px; line-height: 1; }
  .success-meta { color: var(--black); opacity: 0.7; font-size: 14px; margin: 12px 0 4px; line-height: 1.4; }

  .pay-section {
    margin: 24px 0 8px;
  }
  .pay-headline {
    color: var(--red-dark);
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    margin-bottom: 12px;
  }
  .pay-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 380px) {
    .pay-grid { grid-template-columns: 1fr; }
  }
  .pay-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 16px 12px;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    gap: 8px;
    min-height: 230px;
    justify-content: space-between;
  }
  .pay-card .pc-label { font-size: 12.5px; color: var(--red-dark); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .pay-card .pc-sub { font-size: 12px; color: rgba(0,0,0,0.6); }
  #qrcode {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    height: 220px;
    margin: 32px auto;
    padding: 12px;
    background: #fff;
    border-radius: 8px;
  }
  #qrcode img, #qrcode canvas { display: block; }

  .pay-btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    min-height: 56px;
    background: var(--red);
    color: var(--white);
    border-radius: var(--radius-md);
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    box-shadow: var(--shadow-cta);
    margin-top: 8px;
  }

  .pay-tip {
    background: rgba(255,210,74,0.20);
    border: 1px solid rgba(255,210,74,0.45);
    color: var(--red-dark);
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.45;
    margin: 14px 0;
    text-align: left;
  }
  .pay-tip strong { font-weight: 700; }

  .iban-line {
    font-size: 12px;
    color: rgba(0,0,0,0.55);
    margin-top: 10px;
    line-height: 1.45;
  }
  .iban-line code {
    font-family: 'DM Sans', monospace;
    background: rgba(0,0,0,0.04);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  /* Product hero — edge-to-edge full-viewport image, flush against form */
  .product-hero {
    width: 100vw;
    margin: 0;
    padding: 0 0 40px;       /* 40px breathing room below the photo */
    line-height: 0;          /* kill inline image bottom-gap */
  }
  .product-img {
    width: 100%;
    max-width: none;
    height: auto;
    display: block;
    margin: 0;
    padding: 0;
    filter: none;
  }

  /* Intro / step 0 — hide the form chrome, only banner + clickable photo */
  body.on-intro #app .topbar,
  body.on-intro #app .steps,
  body.on-intro #app #restart-btn { display: none; }
  body.on-intro #app { padding: 0; min-height: 0; }
  body.on-intro .product-hero { cursor: pointer; transition: opacity 160ms ease; }
  body.on-intro .product-hero:hover { opacity: 0.92; }
  body.on-intro .product-hero:active { opacity: 0.85; }

  /* Subdue product hero on success step for focus */
  body.on-success .product-hero { opacity: 0.4; }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 8px; height: 12px;
    pointer-events: none;
    z-index: 9999;
    border-radius: 2px;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<!-- Hidden static form: lets Netlify Forms detect & capture submissions even when JS posts dynamically -->
<form name="ellemelle-signup" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input name="voornaam" type="text">
  <input name="telefoon" type="tel">
  <input name="email"    type="email">
  <input name="kanaal"   type="text">
  <input name="straat"   type="text">
  <input name="huisnummer" type="text">
  <input name="toevoeging" type="text">
  <input name="postcode" type="text">
  <input name="plaats"   type="text">
  <input name="bot-field" type="text">
</form>

<!-- Top counter banner -->
<div class="top-banner" id="counter">
  <span id="counter-text">Help ons lanceren</span>
</div>

<main id="app">

  <!-- Topbar (step progress only) -->
  <div class="topbar">
    <span class="progress-text" id="progress-text">Stap 1 van 6</span>
  </div>

  <!-- Step container -->
  <div class="steps" id="steps">

    <!-- STEP 0: Intro (no UI here — body.on-intro hides #app, pot photo is clickable) -->
    <section class="step" data-step="0" aria-hidden="true"></section>

    <!-- STEP 1: Voornaam -->
    <section class="step active" data-step="1">
      <h1 class="step-question">Hoe heet je?</h1>
      <div class="field">
        <input id="input-voornaam" type="text" autocomplete="given-name" autocapitalize="words" placeholder="Je voornaam" maxlength="40">
      </div>
      <div class="error" data-step-error></div>
      <button class="btn-primary" data-next>Volgende →</button>
    </section>

    <!-- STEP 2: Postcode -->
    <section class="step" data-step="2">
      <h1 class="step-question">Wat is je postcode, <span data-name-slot>…</span>?</h1>
      <div class="field">
        <input id="input-postcode" type="text" inputmode="text" autocomplete="postal-code" autocapitalize="characters" placeholder="2011 AA" maxlength="7" spellcheck="false">
      </div>
      <div class="error" data-step-error></div>
      <button class="btn-primary" data-next>Volgende →</button>
    </section>

    <!-- STEP 3: Huisnummer + adres lookup -->
    <section class="step" data-step="3">
      <h1 class="step-question">Welk huisnummer?</h1>
      <div class="row-2">
        <div class="field">
          <input id="input-huisnr" type="text" inputmode="numeric" autocomplete="address-line2" placeholder="Huisnummer" maxlength="6">
        </div>
        <div class="field">
          <input id="input-toev" type="text" autocomplete="off" placeholder="Toev." maxlength="6">
        </div>
      </div>
      <div class="address-confirm" id="address-confirm" hidden></div>
      <div id="manual-address" hidden>
        <div class="field" style="margin-top:10px;">
          <input id="input-straat" type="text" autocomplete="street-address" placeholder="Straat (handmatig)">
        </div>
        <div class="field">
          <input id="input-plaats" type="text" autocomplete="address-level2" placeholder="Plaats" value="Haarlem">
        </div>
      </div>
      <div class="error" data-step-error></div>
      <button class="btn-primary" data-next>Volgende →</button>
    </section>

    <!-- STEP 4: Kanaal -->
    <section class="step" data-step="4">
      <h1 class="step-question">Hoe willen we je laten weten wanneer we bezorgen?</h1>
      <div class="kanaal-options">
        <button class="kanaal-card" data-kanaal="whatsapp" type="button">
          <span><span class="label">WhatsApp</span><span class="sub">Snelste manier — bericht op je telefoon</span></span>
        </button>
        <button class="kanaal-card" data-kanaal="email" type="button">
          <span><span class="label">E-mail</span><span class="sub">Liever per mail? Ook prima.</span></span>
        </button>
      </div>
      <div class="error" data-step-error></div>
      <button class="btn-primary" id="kanaal-next" data-next disabled>Volgende →</button>
    </section>

    <!-- STEP 5: Contact -->
    <section class="step" data-step="5">
      <h1 class="step-question">En je <span id="contact-noun">06-nummer</span>?</h1>
      <div class="field" id="field-tel" hidden>
        <input id="input-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78" maxlength="14">
      </div>
      <div class="field" id="field-email" hidden>
        <input id="input-email" type="email" inputmode="email" autocomplete="email" placeholder="naam@email.nl" spellcheck="false">
      </div>
      <div class="error" data-step-error></div>
      <button class="btn-primary" data-next>Volgende →</button>
    </section>

    <!-- STEP 6: Bevestig -->
    <section class="step" data-step="6">
      <h1 class="step-question">Klopt dit, <span data-name-slot>…</span>?</h1>
      <div class="order-card" id="order-summary-content"></div>
      <label class="check-row">
        <input type="checkbox" id="confirm-checkbox">
        <span>Ja, ik wil 1 pot ELLEMELLE chocopasta voor €6 (€5 + €1 statiegeld), bezorgd binnen 4 weken in Haarlem.</span>
      </label>
      <div class="error" data-step-error></div>
      <button class="btn-primary" id="submit-btn" data-next>Plaats bestelling →</button>
    </section>

    <!-- STEP 7: Success — title + QR + pay button only -->
    <section class="step success" data-step="7">
      <h1 class="step-question">Bedankt!</h1>
      <div id="qrcode"></div>
      <a href="#" class="btn-primary" id="tikkie-btn" target="_blank" rel="noopener">Zelf betalen</a>
      <button id="reset-btn" type="button" hidden></button>
    </section>

  </div>

  <!-- Optional: restart the signup -->
  <button id="restart-btn" class="btn-outline" type="button" hidden>Start opnieuw</button>

</main>

<!-- Pot photo, edge-to-edge under the form -->
<section class="product-hero">
  <img class="product-img" src="Images/product.png" alt="ELLEMELLE chocopasta pot" loading="lazy">
</section>

<!-- QR code library (vanilla, ~3KB gzip) -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>

<script>
(function(){
  'use strict';

  // --- Config & state ----------------------------------------------------
  const TIKKIE_FALLBACK = ['https://tikkie.example.com/A', 'https://tikkie.example.com/B'];
  const TOTAL_STEPS = 6;
  const formData = {
    voornaam: '', telefoon: '', email: '', kanaal: '',
    straat: '', huisnummer: '', toevoeging: '', postcode: '', plaats: ''
  };
  let currentStep = 0;
  let counterCount = 0;
  let counterMax = 10;
  let configCache = null;
  let lastLookup = '';

  // --- Persistent state (localStorage, 7-day TTL) -----------------------
  const STATE_KEY = 'ellemelle_signup_state_v1';
  const STATE_TTL = 7 * 24 * 60 * 60 * 1000;

  function saveState() {
    try {
      const payload = { step: currentStep, data: { ...formData }, savedAt: Date.now() };
      localStorage.setItem(STATE_KEY, JSON.stringify(payload));
    } catch (e) {}
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.savedAt || (Date.now() - obj.savedAt) > STATE_TTL) {
        localStorage.removeItem(STATE_KEY); return null;
      }
      return obj;
    } catch (e) { return null; }
  }
  function clearState() {
    try { localStorage.removeItem(STATE_KEY); } catch (e) {}
  }

  // --- DOM refs ----------------------------------------------------------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const stepEls = $$('.step');
  const progressEl = $('#progress-text');
  const backBtn = document.getElementById('back-btn') || { hidden: true, addEventListener: () => {} };
  const counterEl = $('#counter');
  const counterText = $('#counter-text');

  // --- Step navigation ---------------------------------------------------
  function showStep(n) {
    stepEls.forEach(s => s.classList.toggle('active', parseInt(s.dataset.step, 10) === n));
    // Intro state — special handling
    if (n === 0) {
      document.body.classList.add('on-intro');
      document.body.classList.remove('on-success');
      backBtn.hidden = true;
      progressEl.textContent = '';
    } else {
      document.body.classList.remove('on-intro');
    }
    if (n === 7) {
      progressEl.textContent = '';
      backBtn.hidden = true;
      document.body.classList.add('on-success');
    } else if (n >= 1) {
      progressEl.textContent = 'Stap ' + n + ' van ' + TOTAL_STEPS;
      backBtn.hidden = (n <= 1);
      document.body.classList.remove('on-success');
    }
    // Restart button only appears from step 2 onward (and not on success or intro)
    const rb = document.getElementById('restart-btn');
    if (rb) rb.hidden = (n <= 1 || n === 7);
    // focus first input
    setTimeout(() => {
      const active = $('.step.active');
      if (!active) return;
      const inp = active.querySelector('input:not([type=hidden]):not([hidden]):not([type=checkbox])');
      // Only autofocus on non-touch — keyboards on mobile are intrusive on each step
      if (inp && !('ontouchstart' in window)) {
        try { inp.focus({ preventScroll: true }); } catch(e) { inp.focus(); }
      }
      // Scroll active step into view (smooth)
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 120);
  }

  function next() {
    // From intro screen, allow advancing to step 1 without validation
    if (currentStep === 0) {
      currentStep = 1;
      prepareStep(1);
      showStep(1);
      saveState();
      return;
    }
    if (!validateStep(currentStep)) return;
    if (currentStep === TOTAL_STEPS) {
      submitOrder();
      return;
    }
    currentStep++;
    prepareStep(currentStep);
    showStep(currentStep);
    saveState();
  }

  function back() {
    if (currentStep > 1 && currentStep < 7) {
      currentStep--;
      hideError();
      showStep(currentStep);
      saveState();
    }
  }

  function prepareStep(n) {
    // Substitute name slot
    $$('[data-name-slot]').forEach(el => { el.textContent = formData.voornaam || 'jij'; });

    if (n === 5) {
      // Show right contact field based on kanaal
      const isWA = formData.kanaal === 'whatsapp';
      $('#field-tel').hidden = !isWA;
      $('#field-email').hidden = isWA;
      $('#contact-noun').textContent = isWA ? '06-nummer' : 'e-mailadres';
    }
    if (n === 6) renderOrderSummary();
  }

  // --- Validation --------------------------------------------------------
  function showError(msg, root) {
    const stepEl = root || $('.step.active');
    const err = stepEl.querySelector('.error');
    if (err) { err.textContent = msg; err.classList.add('visible'); }
  }
  function hideError() {
    $$('.error').forEach(e => e.classList.remove('visible'));
  }

  function validateStep(n) {
    hideError();
    switch (n) {
      case 1: {
        const v = $('#input-voornaam').value.trim();
        if (!v) { showError('Vul je voornaam in.'); return false; }
        if (v.length > 40) { showError('Iets korter graag (max 40 tekens).'); return false; }
        formData.voornaam = v;
        return true;
      }
      case 2: {
        const raw = $('#input-postcode').value.replace(/\s+/g, '').toUpperCase();
        if (!raw) { showError('Vul je postcode in.'); return false; }
        if (!/^\d{4}[A-Z]{2}$/.test(raw)) {
          showError('Vul een geldige NL postcode in, bv. 2011 AA.'); return false;
        }
        if (!/^(20|21)/.test(raw)) {
          showError('Sorry, Ellis & Melle bezorgen alleen in Haarlem'); return false;
        }
        formData.postcode = raw.slice(0,4) + ' ' + raw.slice(4);
        return true;
      }
      case 3: {
        const num = $('#input-huisnr').value.trim();
        if (!num || !/^\d+/.test(num)) { showError('Vul je huisnummer in.'); return false; }
        formData.huisnummer = num.replace(/\D/g, '').slice(0,6);
        formData.toevoeging = $('#input-toev').value.trim().slice(0,6);
        // If manual address visible, capture
        if (!$('#manual-address').hidden) {
          formData.straat = $('#input-straat').value.trim();
          formData.plaats = $('#input-plaats').value.trim() || 'Haarlem';
          if (!formData.straat) { showError('Vul je straatnaam in.'); return false; }
        }
        if (!formData.straat) {
          // Try one final lookup synchronously
          showError('Even wachten — we zoeken je straat op…');
          lookupAddress().then(() => {
            if (formData.straat) { hideError(); next(); }
            else { showError('Kon adres niet vinden. Vul handmatig in.'); $('#manual-address').hidden = false; $('#input-straat').focus(); }
          });
          return false;
        }
        return true;
      }
      case 4: {
        if (!formData.kanaal) { showError('Kies een kanaal.'); return false; }
        return true;
      }
      case 5: {
        if (formData.kanaal === 'whatsapp') {
          const tel = $('#input-tel').value.trim();
          const cleaned = tel.replace(/[\s\-]/g, '');
          if (!/^(\+31|0031|0)6\d{8}$/.test(cleaned)) {
            showError('Vul een geldig 06-nummer in.'); return false;
          }
          formData.telefoon = tel;
        } else {
          const em = $('#input-email').value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
            showError('Vul een geldig e-mailadres in.'); return false;
          }
          formData.email = em;
        }
        return true;
      }
      case 6: {
        if (!$('#confirm-checkbox').checked) {
          showError('Vink het hokje aan om te bevestigen.'); return false;
        }
        return true;
      }
    }
    return false;
  }

  // --- Address lookup ----------------------------------------------------
  let lookupInFlight = 0;
  async function lookupAddress() {
    const pc = formData.postcode.replace(/\s+/g, '');
    const nr = (formData.huisnummer || $('#input-huisnr').value || '').replace(/\D/g, '');
    if (!pc || !nr) return;
    const key = pc + '-' + nr;
    if (key === lastLookup) return;
    lastLookup = key;

    const ac = $('#address-confirm');
    const ma = $('#manual-address');
    // Loading state — show a friendly waiting message; hide manual
    ac.hidden = false;
    ac.classList.remove('notfound');
    ac.classList.add('loading');
    ac.textContent = 'Adres ophalen…';
    ma.hidden = true;

    const myCall = ++lookupInFlight;
    try {
      const r = await fetch('/api/postcode?postcode=' + encodeURIComponent(pc) + '&number=' + encodeURIComponent(nr));
      // If a newer call started, ignore stale response
      if (myCall !== lookupInFlight) return;
      if (!r.ok && r.status !== 404) {
        // Network/server error — keep address-confirm hidden, don't accuse the user
        ac.hidden = true;
        ac.classList.remove('loading');
        ma.hidden = true;
        lastLookup = ''; // allow retry
        return;
      }
      const data = r.ok ? await r.json() : null;
      ac.classList.remove('loading');
      if (data && data.street && data.city) {
        formData.straat = data.street;
        formData.plaats = data.city;
        ac.innerHTML = '<strong>' + escapeHtml(data.street) + ' ' + escapeHtml(formData.huisnummer) +
          (formData.toevoeging ? '-' + escapeHtml(formData.toevoeging) : '') +
          '</strong><small>' + escapeHtml(formData.postcode) + ' ' + escapeHtml(data.city) + '</small>';
        ac.hidden = false;
        ma.hidden = true;
        saveState();
      } else {
        ac.classList.add('notfound');
        ac.textContent = 'Adres niet gevonden — vul handmatig in.';
        ma.hidden = false;
      }
    } catch (e) {
      if (myCall !== lookupInFlight) return;
      // Network error — keep silent, allow retry
      ac.hidden = true;
      ac.classList.remove('loading');
      ma.hidden = true;
      lastLookup = '';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // --- Order summary -----------------------------------------------------
  function renderOrderSummary() {
    const adres = (formData.straat || '(straat)') + ' ' + formData.huisnummer +
      (formData.toevoeging ? '-' + formData.toevoeging : '');
    const stad  = formData.postcode + ' ' + (formData.plaats || 'Haarlem');
    const kIcon = formData.kanaal === 'whatsapp' ? 'WhatsApp' : 'E-mail';
    const contact = formData.kanaal === 'whatsapp' ? formData.telefoon : formData.email;
    $('#order-summary-content').innerHTML =
      '<div class="order-line"><span>1× ELLEMELLE pot 250g</span><span>€5,00</span></div>' +
      '<div class="order-line"><span>Statiegeld glazen pot</span><span>€1,00</span></div>' +
      '<div class="order-line total"><span>Totaal</span><span>€6,00</span></div>' +
      '<div class="order-meta">' +
        '<strong>Bezorgadres</strong><br>' + escapeHtml(adres) + '<br>' + escapeHtml(stad) + '<br><br>' +
        '<strong>Updates via</strong> ' + kIcon + '<br>' + escapeHtml(contact) + '<br><br>' +
        'Binnen 4 weken aan je deur door Ellis & Melle.' +
      '</div>';
  }

  // --- Submit ------------------------------------------------------------
  function encodeForm(data) {
    return Object.keys(data).map(k =>
      encodeURIComponent(k) + '=' + encodeURIComponent(data[k] || '')
    ).join('&');
  }

  async function submitOrder() {
    const btn = $('#submit-btn');
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    hideError();

    const payload = Object.assign({}, formData);

    // Strategy: try our signup function first (Supabase if configured, else forwards to Netlify Forms).
    // Fall back to direct Netlify Forms POST if the function is unreachable.
    let ok = false;
    try {
      const r = await fetch('/.netlify/functions/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      ok = r.ok;
    } catch (e) { ok = false; }

    if (!ok) {
      try {
        const body = encodeForm(Object.assign({ 'form-name': 'ellemelle-signup', 'bot-field': '' }, payload));
        const r2 = await fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body
        });
        ok = r2.ok;
      } catch (e) { ok = false; }
    }

    if (!ok) {
      btn.disabled = false;
      btn.textContent = 'Plaats bestelling →';
      showError('Er ging iets mis bij opslaan. Probeer het nog eens.');
      return;
    }

    // Optimistic counter bump
    counterCount = Math.min(counterMax, counterCount + 1);
    updateCounterPill();

    // Move to success
    currentStep = 7;
    clearState();
    prepareSuccessStep();
    showStep(7);
    setTimeout(burstConfetti, 200);
  }

  function prepareSuccessStep() {
    const tikkies = (configCache && configCache.tikkieA && configCache.tikkieB)
      ? [configCache.tikkieA, configCache.tikkieB] : TIKKIE_FALLBACK;
    const tikkieUrl = tikkies[Math.floor(Math.random() * tikkies.length)];
    const tBtn = document.getElementById('tikkie-btn');
    if (tBtn) tBtn.href = tikkieUrl;

    const qrEl = $('#qrcode');
    qrEl.innerHTML = '';
    if (window.QRCode) {
      try {
        new QRCode(qrEl, {
          text: tikkieUrl, width: 200, height: 200,
          colorDark: '#000000', colorLight: '#FFFFFF',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (e) { qrEl.textContent = 'QR niet geladen — gebruik knop'; }
    } else {
      qrEl.textContent = 'QR laadt…';
    }
  }

  // --- Reset -------------------------------------------------------------
  function resetForm() {
    clearState();
    Object.keys(formData).forEach(k => formData[k] = '');
    $$('input').forEach(i => {
      if (i.type === 'hidden') return;
      if (i.type === 'checkbox') i.checked = false;
      else i.value = (i.id === 'input-plaats') ? 'Haarlem' : '';
    });
    $('#address-confirm').hidden = true;
    $('#address-confirm').innerHTML = '';
    $('#address-confirm').classList.remove('loading','notfound');
    $('#manual-address').hidden = true;
    $('#submit-btn').disabled = false;
    $('#submit-btn').textContent = 'Plaats bestelling →';
    $$('.kanaal-card').forEach(c => c.style.borderColor = '');
    const kbReset = document.getElementById('kanaal-next');
    if (kbReset) kbReset.disabled = true;
    const cb = document.getElementById('confirm-checkbox'); if (cb) cb.checked = false;
    lastLookup = '';
    hideError();
    currentStep = 1;
    showStep(1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // --- Counter -----------------------------------------------------------
  async function loadCounter() {
    try {
      const r = await fetch('/api/count', { cache: 'no-store' });
      if (!r.ok) throw new Error('count');
      const data = await r.json();
      counterCount = parseInt(data.count, 10) || 0;
      counterMax = parseInt(data.max, 10) || 10;
    } catch (e) {
      // keep last known
    }
    updateCounterPill();
  }
  function updateCounterPill() {
    if (counterCount >= counterMax) {
      counterText.textContent = 'Help ons lanceren — uitverkocht';
      counterEl.classList.add('full');
    } else {
      const left = counterMax - counterCount;
      counterText.textContent = 'Help ons lanceren — nog ' + left + (left === 1 ? ' plek' : ' plekken');
      counterEl.classList.remove('full');
    }
  }

  async function loadConfig() {
    try {
      const r = await fetch('/api/config', { cache: 'no-store' });
      if (r.ok) configCache = await r.json();
    } catch (e) { /* swallow */ }
  }

  // --- Confetti ----------------------------------------------------------
  function burstConfetti() {
    const colors = ['#D9301E', '#8B1A0E', '#FFD24A', '#F5EFE6'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.top = '20%';
      c.style.left = '50%';
      c.style.background = colors[i % colors.length];
      c.style.transition = 'transform 1.6s cubic-bezier(.18,.7,.4,1), opacity 1.6s ease-out';
      document.body.appendChild(c);
      requestAnimationFrame(() => {
        const x = (Math.random() - 0.5) * window.innerWidth * 0.9;
        const y = (Math.random() * 0.6 + 0.2) * window.innerHeight;
        const r = Math.random() * 720 - 360;
        c.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg)';
        c.style.opacity = '0';
      });
      setTimeout(() => c.remove(), 1700);
    }
  }

  // --- Wiring ------------------------------------------------------------
  document.addEventListener('DOMContentLoaded', () => {
    loadConfig();
    loadCounter();
    showStep(1);

    $$('[data-next]').forEach(b => b.addEventListener('click', next));
    backBtn.addEventListener('click', back);

    // Click pot photo on intro to advance to step 1
    const heroEl = document.querySelector('.product-hero');
    if (heroEl) {
      heroEl.setAttribute('role', 'button');
      heroEl.setAttribute('tabindex', '0');
      heroEl.setAttribute('aria-label', 'Start de bestelling');
      heroEl.addEventListener('click', () => {
        if (currentStep === 0) next();
      });
      heroEl.addEventListener('keydown', e => {
        if (currentStep === 0 && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault(); next();
        }
      });
    }

    $$('.kanaal-card').forEach(card => {
      card.addEventListener('click', () => {
        formData.kanaal = card.dataset.kanaal;
        $$('.kanaal-card').forEach(c => c.style.borderColor = '');
        card.style.borderColor = 'var(--red)';
        const kb = document.getElementById('kanaal-next');
        if (kb) kb.disabled = false;
        hideError();
        saveState();
      });
    });

    $('#reset-btn').addEventListener('click', resetForm);

    // Postcode autoformat (4 digits + 2 letters)
    const pc = $('#input-postcode');
    pc.addEventListener('input', () => {
      let v = pc.value.toUpperCase().replace(/[^0-9A-Z]/g, '');
      if (v.length > 4) v = v.slice(0,4) + ' ' + v.slice(4,6);
      pc.value = v;
    });

    // Address lookup on huisnummer blur (or input after debounce)
    let lookupTO;
    const trigger = () => {
      formData.huisnummer = $('#input-huisnr').value.replace(/\D/g,'');
      if (formData.huisnummer.length >= 1) lookupAddress();
    };
    $('#input-huisnr').addEventListener('blur', trigger);
    $('#input-huisnr').addEventListener('input', () => {
      clearTimeout(lookupTO);
      lookupTO = setTimeout(trigger, 800);
    });

    // Enter to advance
    $$('input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.type !== 'submit') {
          e.preventDefault();
          if (currentStep <= TOTAL_STEPS) next();
        }
      });
    });

    // Save state on every input blur
    const FIELD_MAP = {
      'input-voornaam':'voornaam', 'input-postcode':'postcode',
      'input-huisnr':'huisnummer', 'input-toev':'toevoeging',
      'input-straat':'straat', 'input-plaats':'plaats',
      'input-tel':'telefoon', 'input-email':'email'
    };
    Object.entries(FIELD_MAP).forEach(([id, key]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('blur', () => {
        let v = (el.value || '').trim();
        if (key === 'postcode') v = v.replace(/\s+/g,'').toUpperCase();
        if (key === 'huisnummer' || key === 'toevoeging') v = v.slice(0, 8);
        formData[key] = v;
        saveState();
      });
    });
    // Kanaal buttons already set formData.kanaal in their click handler — save then

    // Restart button → clear localStorage + reset
    const restartBtn = document.getElementById('restart-btn');
    if (restartBtn) {
      restartBtn.addEventListener('click', () => {
        if (!confirm('Weet je zeker dat je opnieuw wil beginnen? Je ingevulde gegevens worden gewist.')) return;
        clearState();
        resetForm();
      });
    }

    // Restore saved state if any
    const saved = loadState();
    if (saved && saved.data && saved.step >= 1 && saved.step <= TOTAL_STEPS) {
      // Returning visitor with progress → jump to saved step (not intro)
      Object.assign(formData, saved.data);
      // Hydrate inputs
      Object.entries(FIELD_MAP).forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (el && formData[key]) el.value = formData[key];
      });
      // Hydrate postcode formatted
      const pcEl = document.getElementById('input-postcode');
      if (pcEl && formData.postcode) {
        const v = formData.postcode.replace(/\s+/g,'').toUpperCase();
        pcEl.value = v.length > 4 ? v.slice(0,4) + ' ' + v.slice(4) : v;
      }
      // Hydrate kanaal selection (highlight matching kanaal-card + enable button)
      if (formData.kanaal) {
        $$('.kanaal-card').forEach(c => {
          c.style.borderColor = (c.dataset.kanaal === formData.kanaal) ? 'var(--red)' : '';
        });
        const kb = document.getElementById('kanaal-next');
        if (kb) kb.disabled = false;
      }
      // Jump to saved step (prepare + show)
      currentStep = saved.step;
      prepareStep(currentStep);
      showStep(currentStep);
      // If on the address step, trigger a lookup so the preview re-populates
      if (currentStep === 3 && formData.postcode && formData.huisnummer) {
        setTimeout(() => { lastLookup = ''; lookupAddress(); }, 200);
      }
    } else {
      // Fresh visitor → intro screen
      currentStep = 0;
      showStep(0);
    }

    // Refresh counter every 30s
    setInterval(loadCounter, 30000);
  });
})();
</script>
</body>
</html>
