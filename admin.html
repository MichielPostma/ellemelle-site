<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ELLEMELLE — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D9301E;
    --red-dark: #8B1A0E;
    --cream: #feece2;
    --cream-dark: #ECE3D2;
    --black: #1A1A1A;
    --white: #fff;
    --green: #16823d;
    --shadow: 0 2px 10px rgba(139,26,14,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--cream);
    color: var(--black);
    padding: 24px;
    min-height: 100dvh;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: 'Bowlby One', sans-serif;
    color: var(--red);
    font-size: 28px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .sub { color: var(--red-dark); opacity: 0.7; margin-bottom: 24px; font-size: 14px; }

  /* Login card */
  .login-card {
    max-width: 380px;
    margin: 60px auto;
    background: var(--white);
    border-radius: 16px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .login-card input {
    width: 100%; min-height: 52px;
    padding: 12px 16px;
    font-size: 16px;
    background: var(--cream);
    border: 2px solid transparent;
    border-radius: 10px;
    margin: 16px 0;
    font-family: inherit;
  }
  .login-card input:focus { outline: none; border-color: var(--red); }
  .btn {
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    min-height: 48px;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-sm { padding: 6px 12px; min-height: 32px; font-size: 13px; }
  .btn-ghost { background: transparent; color: var(--red-dark); border: 2px solid rgba(139,26,14,0.2); }
  .btn-ghost:hover { border-color: var(--red); }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--white);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat .num { font-family: 'Bowlby One', sans-serif; font-size: 30px; color: var(--red); line-height: 1; }
  .stat .lbl { font-size: 12px; color: rgba(0,0,0,0.6); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; font-weight: 600; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 14px;
  }
  .toolbar select, .toolbar input[type="search"] {
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: var(--white);
    font-size: 14px;
    font-family: inherit;
    min-height: 42px;
    box-shadow: var(--shadow);
  }
  .toolbar select:focus, .toolbar input[type="search"]:focus { outline: none; border-color: var(--red); }
  .spacer { flex: 1; }

  /* Table */
  table {
    width: 100%;
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow);
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
  }
  th, td {
    padding: 12px 14px;
    text-align: left;
    font-size: 14px;
    border-bottom: 1px solid var(--cream);
    vertical-align: top;
  }
  th {
    background: var(--cream-dark);
    font-weight: 700;
    color: var(--red-dark);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(217,48,30,0.03); }
  td.center { text-align: center; }
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .pill.wa { background: rgba(37, 211, 102, 0.15); color: #1c7d3f; }
  .pill.em { background: rgba(217, 48, 30, 0.12); color: var(--red-dark); }
  .check {
    width: 24px; height: 24px;
    accent-color: var(--green);
    cursor: pointer;
  }
  .err {
    color: var(--red);
    padding: 12px;
    background: rgba(217,48,30,0.06);
    border-radius: 8px;
    margin: 10px 0;
    font-size: 14px;
    display: none;
  }
  .err.visible { display: block; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: rgba(0,0,0,0.5);
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 720px) {
    body { padding: 14px; }
    .stats { grid-template-columns: 1fr 1fr 1fr; }
    .stat .num { font-size: 22px; }
    table { font-size: 12px; }
    th, td { padding: 9px 10px; }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Login screen -->
  <div id="login" class="login-card">
    <h1>ELLEMELLE admin</h1>
    <p class="sub">Voer het wachtwoord in om bestellingen te bekijken.</p>
    <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn" id="login-btn" style="width:100%;">Inloggen →</button>
  </div>

  <!-- Dashboard -->
  <div id="dash" hidden>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;">
      <div>
        <h1>ELLEMELLE bestellingen</h1>
        <p class="sub">Bekijk signups en houd betaalstatus bij.</p>
      </div>
      <button class="btn btn-sm btn-ghost" id="logout-btn">Uitloggen</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Signups</div></div>
      <div class="stat"><div class="num" id="stat-paid">0</div><div class="lbl">Betaald</div></div>
      <div class="stat"><div class="num" id="stat-out">0</div><div class="lbl">Openstaand</div></div>
    </div>

    <div class="toolbar">
      <select id="filter">
        <option value="all">Alles</option>
        <option value="open">Alleen openstaand</option>
        <option value="paid">Alleen betaald</option>
      </select>
      <input type="search" id="search" placeholder="Zoek op naam, adres, e-mail…">
      <div class="spacer"></div>
      <button class="btn btn-sm btn-ghost" id="refresh-btn">↻ Verversen</button>
      <button class="btn btn-sm" id="csv-btn">⬇ Export CSV</button>
    </div>

    <div class="err" id="dash-err"></div>
    <div id="table-wrap"></div>

    <p class="sub" id="source-note" style="margin-top:16px;font-size:12px;"></p>
  </div>

</div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);

  let pw = sessionStorage.getItem('ellemelle_pw') || '';
  let signups = [];
  let dataSource = '';

  function show(el) { el.hidden = false; }
  function hide(el) { el.hidden = true; }

  function setErr(el, msg) {
    el.textContent = msg || '';
    el.classList.toggle('visible', !!msg);
  }

  async function login() {
    pw = $('#pw').value.trim();
    if (!pw) { setErr($('#login-err'), 'Vul het wachtwoord in.'); return; }
    setErr($('#login-err'), '');
    $('#login-btn').disabled = true;
    $('#login-btn').textContent = 'Bezig…';
    try {
      const ok = await loadSignups();
      if (ok) {
        sessionStorage.setItem('ellemelle_pw', pw);
        hide($('#login'));
        show($('#dash'));
      }
    } finally {
      $('#login-btn').disabled = false;
      $('#login-btn').textContent = 'Inloggen →';
    }
  }

  async function loadSignups() {
    setErr($('#dash-err'), '');
    try {
      const r = await fetch('/.netlify/functions/admin-list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      if (r.status === 401) {
        setErr($('#login-err'), 'Verkeerd wachtwoord.');
        sessionStorage.removeItem('ellemelle_pw');
        return false;
      }
      if (!r.ok) {
        const t = await r.text();
        setErr($('#dash-err'), 'Server: ' + t);
        setErr($('#login-err'), 'Kon niet laden — check Netlify env vars.');
        return false;
      }
      const data = await r.json();
      signups = data.signups || [];
      dataSource = data.source || '';
      $('#stat-total').textContent = data.total || 0;
      $('#stat-paid').textContent = data.paid || 0;
      $('#stat-out').textContent = data.outstanding || (data.total || 0);
      $('#source-note').textContent = dataSource
        ? 'Bron: ' + dataSource + (data.note ? ' — ' + data.note : '')
        : '';
      render();
      return true;
    } catch (e) {
      setErr($('#login-err'), 'Netwerkfout: ' + (e.message || e));
      return false;
    }
  }

  function render() {
    const filter = $('#filter').value;
    const q = ($('#search').value || '').toLowerCase().trim();
    let rows = signups.slice();
    if (filter === 'open') rows = rows.filter(r => !r.betaald);
    if (filter === 'paid') rows = rows.filter(r => r.betaald);
    if (q) {
      rows = rows.filter(r => [r.voornaam, r.email, r.telefoon, r.straat, r.postcode, r.plaats]
        .filter(Boolean).join(' ').toLowerCase().includes(q));
    }

    if (!rows.length) {
      $('#table-wrap').innerHTML = '<div class="empty">Nog geen signups die matchen.</div>';
      return;
    }

    const html = ['<table><thead><tr>',
      '<th>Datum</th>',
      '<th>Naam</th>',
      '<th>Adres</th>',
      '<th class="hide-mobile">Postcode / plaats</th>',
      '<th>Kanaal</th>',
      '<th>Contact</th>',
      '<th class="center">Betaald</th>',
      '</tr></thead><tbody>'];
    rows.forEach(r => {
      const dt = r.created_at ? new Date(r.created_at).toLocaleString('nl-NL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '–';
      const adres = esc(r.straat) + ' ' + esc(r.huisnummer) + (r.toevoeging ? '-' + esc(r.toevoeging) : '');
      const kPill = r.kanaal === 'whatsapp'
        ? '<span class="pill wa">📱 WA</span>'
        : '<span class="pill em">✉️ Mail</span>';
      const contact = r.kanaal === 'whatsapp' ? (r.telefoon || '–') : (r.email || '–');
      const checked = r.betaald ? 'checked' : '';
      html.push('<tr data-id="' + esc(r.id) + '">');
      html.push('<td>' + dt + '</td>');
      html.push('<td><strong>' + esc(r.voornaam) + '</strong></td>');
      html.push('<td>' + adres + '</td>');
      html.push('<td class="hide-mobile">' + esc(r.postcode) + ' ' + esc(r.plaats) + '</td>');
      html.push('<td>' + kPill + '</td>');
      html.push('<td>' + esc(contact) + '</td>');
      html.push('<td class="center"><input type="checkbox" class="check" data-paid ' + checked + '></td>');
      html.push('</tr>');
    });
    html.push('</tbody></table>');
    $('#table-wrap').innerHTML = html.join('');

    // Wire up paid toggles
    document.querySelectorAll('[data-paid]').forEach(cb => {
      cb.addEventListener('change', async (e) => {
        const tr = e.target.closest('tr');
        const id = tr.dataset.id;
        const betaald = e.target.checked;
        e.target.disabled = true;
        try {
          const r = await fetch('/.netlify/functions/admin-mark-paid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw, id, betaald }),
          });
          if (!r.ok) {
            e.target.checked = !betaald;
            const t = await r.text();
            setErr($('#dash-err'), 'Kon niet updaten: ' + t);
            setTimeout(() => setErr($('#dash-err'), ''), 4000);
          } else {
            const row = signups.find(s => String(s.id) === String(id));
            if (row) row.betaald = betaald;
            const paid = signups.filter(r => r.betaald).length;
            $('#stat-paid').textContent = paid;
            $('#stat-out').textContent = signups.length - paid;
          }
        } catch (err) {
          e.target.checked = !betaald;
          setErr($('#dash-err'), 'Netwerkfout: ' + (err.message || err));
        } finally {
          e.target.disabled = false;
        }
      });
    });
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function toCSV() {
    const cols = ['created_at','voornaam','kanaal','telefoon','email','straat','huisnummer','toevoeging','postcode','plaats','betaald'];
    const lines = [cols.join(',')];
    signups.forEach(r => {
      lines.push(cols.map(c => {
        const v = r[c] == null ? '' : String(r[c]);
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(','));
    });
    return lines.join('\n');
  }

  function downloadCSV() {
    const blob = new Blob([toCSV()], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ellemelle-signups-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Wiring
  document.addEventListener('DOMContentLoaded', () => {
    $('#login-btn').addEventListener('click', login);
    $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('#logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('ellemelle_pw');
      pw = '';
      signups = [];
      hide($('#dash'));
      show($('#login'));
      $('#pw').value = '';
    });
    $('#filter').addEventListener('change', render);
    $('#search').addEventListener('input', render);
    $('#refresh-btn').addEventListener('click', loadSignups);
    $('#csv-btn').addEventListener('click', downloadCSV);

    // Auto-login if pw remembered
    if (pw) {
      loadSignups().then(ok => {
        if (ok) { hide($('#login')); show($('#dash')); }
      });
    }
  });
})();
</script>
</body>
</html>
